name: 'Tauri Build & Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Prevent duplicate release runs for the same ref.
# cancel-in-progress is false so a mid-flight release is never abandoned half-built.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── 1. Create a draft GitHub release ─────────────────────────────────────────
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify versions and bundled bot resources
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(node -p "const t=require('fs').readFileSync('./src-tauri/Cargo.toml','utf8'); const m=t.match(/^version\\s*=\\s*\"([^\"]+)\"/m); if(!m) throw new Error('Cargo.toml version missing'); m[1]")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "package.json=$RELEASE_VERSION tauri.conf.json=$APP_VERSION Cargo.toml=$CARGO_VERSION"
          if [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "tauri.conf.json version ($APP_VERSION) must match package.json ($RELEASE_VERSION)"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Cargo.toml version ($CARGO_VERSION) must match package.json ($RELEASE_VERSION)"
            exit 1
          fi
          # Telegram bot scripts are bundled into installers via tauri.conf.json resources.
          test -f tools/odyssey-telegram-bot.mjs
          test -f tools/odyssey-core.mjs
          test -f tools/odyssey-retrieval.mjs
          test -f tools/odyssey-cli.mjs

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const appVersion = process.env.APP_VERSION;
            const tagName = context.ref.replace('refs/tags/', '');
            const expectedTag = `v${version}`;
            if (tagName !== expectedTag) {
              throw new Error(`Release tag ${tagName} does not match release version ${expectedTag}`);
            }
            if (appVersion !== version) {
              throw new Error(`tauri.conf.json version ${appVersion} must match package.json version ${version}`);
            }
            const isPrerelease = tagName.includes('-');
            const prereleaseLabel = tagName.includes('-alpha')
              ? 'Alpha'
              : tagName.includes('-beta')
                ? 'Beta'
                : 'Prerelease';
            const prereleaseWord = prereleaseLabel.toLowerCase();
            const releaseTypeWord = isPrerelease ? `${prereleaseWord} prerelease` : 'release';
            const notesHeading = isPrerelease ? `${prereleaseLabel} Notes` : 'Release Notes';
            const stabilityNote = isPrerelease
              ? `- This ${prereleaseWord} prerelease may have rough edges around audio-device compatibility and provider-specific transcription behavior.`
              : '- This stable release does not bundle the separate alpha Harry Potter vector store; live world wiki lookup and local RAG stores remain available.';
            const body = [
              `## Odyssey v${version}`,
              '',
              `This ${releaseTypeWord} adds turn rewind and branching, streamed responses, quest tracking, and OpenRouter spend tracking, alongside runtime and interface polish. Download the installer for your platform from the assets below.`,
              '',
              `Bundle version: ${appVersion}`,
              '',
              '### Changelog',
              '',
              '#### Rewind, regenerate, and branch',
              '',
              '- Added per-turn snapshots so any turn can be rewound, undoing it and everything after it.',
              '- Added regenerate for the newest reply, with switching between reply versions.',
              '- Added branching from any reply into a new save that continues from that point.',
              '- Snapshots share the same format across desktop, Terminal, and Telegram play.',
              '',
              '#### Gameplay',
              '',
              '- Added a quest system: the story now tracks goals, with an Active Quests widget and a Quest Journal.',
              '- Added a game-over screen when the character dies, with an option to rewind the last turn.',
              '- Added an "I\'m stuck" hint button that suggests a few things to try.',
              '- Added optional streamed responses so narration appears as it is written.',
              '- Added an auto-narrate option for new turns.',
              '',
              '#### Spend tracking',
              '',
              '- Added OpenRouter token and spend tracking for every API call the app makes.',
              '- Shows per-turn cost, per-save and per-session totals in game, and lifetime totals in Settings.',
              '- Save spend is shared with Terminal and Telegram play and is never undone by a rewind.',
              '',
              '#### Interface and reliability',
              '',
              '- Expanded the theme icon system across character creation, presets, saves, and menus.',
              '- Added direct xAI and Google AI endpoints for game turns.',
              '- Improved retrieval handling and save import/export controls.',
              '',
              `### ${notesHeading}`,
              '',
              '- Spend tracking reads the usage OpenRouter reports; other providers do not report cost.',
              '- Saves from earlier versions load normally; turns played before this release can only have their story text rewound.',
              '- Vector RAG and web/wiki search remain opt-in from desktop Settings; embedding backends must be running when RAG is enabled.',
              stabilityNote,
              '',
              '| Platform | Recommended asset |',
              '| --- | --- |',
              '| Windows | `Odyssey_' + appVersion + '_x64-setup.exe` or `Odyssey_' + appVersion + '_x64_en-US.msi` |',
              '| macOS (Apple Silicon) | `Odyssey_' + appVersion + '_aarch64.dmg` |',
              '| macOS (Intel) | `Odyssey_' + appVersion + '_x64.dmg` |',
              '| Linux | `odyssey_' + appVersion + '_amd64.deb` or `odyssey_' + appVersion + '_amd64.AppImage` |',
              '',
              'See the [README](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '#readme) for setup and usage.',
            ].join('\n');
            const releasePayload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name:              tagName,
              name:                  isPrerelease ? `Odyssey v${version} ${prereleaseLabel}` : `Odyssey v${version}`,
              body,
              draft:                 true,
              prerelease:            isPrerelease,
              generate_release_notes: true,
            };
            let data;
            try {
              ({ data } = await github.rest.repos.createRelease(releasePayload));
            } catch (error) {
              if (error.status !== 422) throw error;
              ({ data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              }));
              ({ data } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                name: releasePayload.name,
                body: releasePayload.body,
                draft: true,
                prerelease: releasePayload.prerelease,
              }));
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                per_page: 100,
              });
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
            return data.id

  # ── 2. Build for every platform and upload artifacts to the draft release ────
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false   # one platform failing must not cancel the others
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pre-install both macOS cross-compile targets on every macOS runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tauri v2 Linux prerequisites (see https://v2.tauri.app/start/prerequisites/).
      # libasound2-dev is required by the `rodio` crate for audio playback.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId:   ${{ needs.create-release.outputs.release_id }}
          projectPath: '.'
          args:        ${{ matrix.args }}

  # ── 3. Publish the release once every platform build succeeds ─────────────────
  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft:      false,
              prerelease: '${{ contains(github.ref_name, '-') }}' === 'true',
              make_latest: '${{ contains(github.ref_name, '-') }}' === 'true' ? 'false' : 'true',
            })
